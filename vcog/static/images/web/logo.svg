<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="A 3 by 3 matrix puzzle with the last cell missing">
  <!-- columns share a colour, rows share a shape; the bottom-right cell is the missing answer -->
  <g fill="#e5384f">
    <circle cx="24" cy="24" r="11"/>
    <rect x="14.1" y="52.1" width="19.8" height="19.8" rx="3"/>
    <path d="M24 88.45 36.1 109.35H11.9z"/>
  </g>
  <g fill="#f0753a">
    <circle cx="62" cy="24" r="11"/>
    <rect x="52.1" y="52.1" width="19.8" height="19.8" rx="3"/>
    <path d="M62 88.45 74.1 109.35H49.9z"/>
  </g>
  <g fill="#14a090">
    <circle cx="100" cy="24" r="11"/>
    <rect x="90.1" y="52.1" width="19.8" height="19.8" rx="3"/>
  </g>
  <rect x="86" y="86" width="28" height="28" rx="3" fill="none" stroke="#9696a0" stroke-width="2.6" stroke-dasharray="5 3.4"/>
</svg>
